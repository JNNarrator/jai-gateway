name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  create-release:
    name: Create release draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      # 幂等创建 draft release（tauri-action 在此 job 会执行完整 tauri build，
      # ubuntu runner 缺 webkit2gtk/glib 系统依赖必然失败，故只建 draft 不构建）；
      # 实际构建与产物上传只发生在下方 macos/windows 的 build-tauri job
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 复用上次运行遗留的同 tag draft（重跑场景）；
          # 否则走 API 直接创建 —— 响应即含 release id。v0.1.2 曾用
          # gh release create + 列表回查取 id，回查撞上 API 最终一致性窗口导致 8s 失败
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
            --jq '.[] | select(.draft and .tag_name == "${{ github.ref_name }}") | .id' | head -1)
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
              -f tag_name="${{ github.ref_name }}" \
              -F draft=true -F prerelease=true \
              -f name="JAI ${{ github.ref_name }}" \
              -f body="见 CHANGELOG.md" --jq '.id')
          fi
          if [ -z "$RELEASE_ID" ]; then
            echo "FAIL: draft release 创建失败"; exit 1
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build-tauri:
    name: Build (${{ matrix.platform }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # beforeBuildCommand 会执行 ui 的 build（tsc + vite），必须先按 lockfile
      # 装依赖：否则 PATH 兜底到 runner 全局 tsc（TS 7），与锁定版本行为不一致
      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      # tauri-bundler 仅以 var_os 判断 APPLE_CERTIFICATE 是否存在（空串也算存在），
      # 会误入 security import 分支并崩溃。未配置证书时必须让变量"不存在"，
      # 因此把签名/未签名拆成两个互斥 step（GITHUB_ENV 无法删除已注入变量）
      - name: Detect macOS signing secret
        id: sign
        run: echo "configured=${{ secrets.APPLE_CERTIFICATE != '' }}" >> "$GITHUB_OUTPUT"

      - name: Build + upload (unsigned macOS)
        if: runner.os == 'macOS' && steps.sign.outputs.configured == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --ci

      - name: Build + upload (signed)
        if: runner.os == 'Windows' || (runner.os == 'macOS' && steps.sign.outputs.configured == 'true')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater 签名（必须；缺失则构建失败）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 签名 + 公证（可选；无证书时产出未签名包）
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows 代码签名（可选；无证书时产出未签名包）
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --ci
