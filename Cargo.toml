[workspace]
resolver = "2"
members = ["crates/gateway-core", "src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["JNNarrator"]

[workspace.dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
] }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
uuid = { version = "1", features = ["v7"] }
rand = "0.8"
sha2 = "0.10"
futures-util = "0.3"
bytes = "1"
zip = "2"

[profile.release]
lto = true
strip = true
