[workspace]
resolver = "2"
members = ["crates/gateway-core", "src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["JNNarrator"]

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
strip = true
